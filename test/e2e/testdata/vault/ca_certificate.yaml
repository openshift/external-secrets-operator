apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: {{VAULT_NAMESPACE}}
spec:
  isCA: true
  commonName: vault-e2e-ca
  secretName: vault-ca
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: vault-selfsigned
    kind: Issuer
    group: cert-manager.io
