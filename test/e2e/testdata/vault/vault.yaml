---
apiVersion: v1
kind: Namespace
metadata:
  name: vault-test

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault-test

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault-test
data:
  vault.hcl: |
    ui = true

    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
    }

    storage "file" {
      path = "/vault/data"
    }

    disable_mlock = true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
      annotations:
        openshift.io/scc: restricted-v2
    spec:
      serviceAccountName: vault
      automountServiceAccountToken: false
      # No pod-level securityContext: restricted-v2 assigns the UID from the
      # namespace range and applies its own seccomp profile automatically.
      # Explicit runAsUser/seccompProfile fields are rejected by this cluster.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - {{VAULT_ARCH}}
      containers:
        - name: vault
          image: icr.io/ppc64le-oss/vault-ppc64le:v1.14.8
          command:
            - vault
          args:
            - server
            - -config=/vault/config/vault.hcl
          env:
            - name: VAULT_API_ADDR
              value: {{VAULT_ADDR}}
            - name: VAULT_ADDR
              value: https://127.0.0.1:8200
            - name: VAULT_SKIP_VERIFY
              value: "true"
          ports:
            - containerPort: 8200
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
            - name: tls
              mountPath: /vault/tls
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: data
          emptyDir: {}
        - name: tls
          secret:
            secretName: vault-server-tls

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault-test
spec:
  selector:
    app: vault
  ports:
    - name: https
      port: 8200
      targetPort: 8200
