apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: merge-registry-auths
  namespace: {{VAULT_NAMESPACE}}
  labels:
    app.kubernetes.io/managed-by: external-secrets-operator-e2e
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: merged-registry-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{- $base := .baseline | fromJson -}}
          {{- $extra := .vault | fromJson -}}
          {{- $merged := merge $base $extra -}}
          {{- $merged | toJson -}}
  data:
    - secretKey: vault
      remoteRef:
        key: registry-auth/extra
        property: dockerconfigjson
    - secretKey: baseline
      remoteRef:
        key: registry-auth-baseline
        property: .dockerconfigjson
      sourceRef:
        storeRef:
          name: kubernetes-backend
          kind: SecretStore
